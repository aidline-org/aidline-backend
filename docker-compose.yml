services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aidline
      POSTGRES_PASSWORD: aidline
      POSTGRES_DB: aidline
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aidline -d aidline']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
